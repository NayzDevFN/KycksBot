services:
  - type: web
    name: kycks-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node api.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: NODE_ENV
        value: production
