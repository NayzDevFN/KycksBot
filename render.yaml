services:
  - type: web
    name: kycks-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=280 api.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: NODE_ENV
        value: production
